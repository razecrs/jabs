name: foundations
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'
      # JABS reads java.base from the JDK's jmods; builds made with JEP 493 leave them out.
      - name: Check the JDK ships jmods
        shell: bash
        run: |
          java -version
          if [ ! -f "$JAVA_HOME/jmods/java.base.jmod" ]; then
            echo "::error::$JAVA_HOME/jmods/java.base.jmod is missing: this JDK build has no jmods (JEP 493), and JABS reads java.base from them"
            exit 1
          fi
          echo "jmods present: $JAVA_HOME/jmods/java.base.jmod"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
        env:
          JABS_REQUIRE_TOOLS: '1'
      - run: cargo clippy --locked --all-targets -- -D warnings
